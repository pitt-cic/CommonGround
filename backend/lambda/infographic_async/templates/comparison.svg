<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect x="0" y="0" width="1080" height="1080" fill="#F7F5F0" />
  <rect x="72" y="80" width="88" height="6" fill="#1D6F63" />

  <text x="72" y="130.00" data-field="eyebrow" data-maxw="700" data-maxlines="1" data-upper="1"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="500" letter-spacing="3.2" fill="#5C6470">{{EYEBROW}}</text>

  <text x="72" y="241.00" data-field="headline" data-maxw="936" data-maxlines="2" data-lead="59"
        font-family="'Source Serif 4', Charter, Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="600" fill="#14181D">{{HEADLINE}}</text>

  <text x="72" y="348.00" data-field="deck" data-maxw="936" data-maxlines="1"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="23" fill="#5C6470">{{DECK}}</text>

  <g>
    <rect x="72" y="392" width="448" height="368" fill="#F1EEE7" stroke="#DCD7CC" stroke-width="1" />
    <rect x="72" y="392" width="448" height="6" fill="#B9B4A8" />
    <text x="102" y="444.00" data-field="left_label" data-maxw="388" data-maxlines="1" data-upper="1"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="18" font-weight="500" letter-spacing="2" fill="#5C6470">{{LEFT_LABEL}}</text>
    <text x="102" y="526.00" font-family="'Source Serif 4', Charter, Georgia, serif"
          font-size="62" font-weight="600" fill="#14181D"><tspan x="102" dy="0">{{LEFT_VALUE}}</tspan></text>
    <text x="102" y="562.00" data-field="left_caption" data-maxw="388" data-maxlines="1" data-upper="1"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="17" font-weight="500" letter-spacing="1.4" fill="#5C6470" fill-opacity="0.8">{{LEFT_CAPTION}}</text>
    <line x1="102" y1="590" x2="490" y2="590" stroke="#DCD7CC" stroke-width="1" />
    <text x="102" y="624.00" data-field="left_detail" data-maxw="388" data-maxlines="4" data-lead="26"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="18.5" fill="#5C6470">{{LEFT_DETAIL}}</text>
  </g>

  <g>
    <rect x="560" y="392" width="448" height="368" fill="#FFFFFF" stroke="#DCD7CC" stroke-width="1" />
    <rect x="560" y="392" width="448" height="6" fill="#1D6F63" />
    <text x="590" y="444.00" data-field="right_label" data-maxw="388" data-maxlines="1" data-upper="1"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="18" font-weight="500" letter-spacing="2" fill="#1D6F63">{{RIGHT_LABEL}}</text>
    <text x="590" y="526.00" font-family="'Source Serif 4', Charter, Georgia, serif"
          font-size="62" font-weight="600" fill="#1D6F63"><tspan x="590" dy="0">{{RIGHT_VALUE}}</tspan></text>
    <text x="590" y="562.00" data-field="right_caption" data-maxw="388" data-maxlines="1" data-upper="1"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="17" font-weight="500" letter-spacing="1.4" fill="#5C6470" fill-opacity="0.8">{{RIGHT_CAPTION}}</text>
    <line x1="590" y1="590" x2="978" y2="590" stroke="#DCD7CC" stroke-width="1" />
    <text x="590" y="624.00" data-field="right_detail" data-maxw="388" data-maxlines="4" data-lead="26"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="18.5" fill="#5C6470">{{RIGHT_DETAIL}}</text>
  </g>

  <g>
    <rect x="72" y="790" width="936" height="110" fill="#1D6F63" fill-opacity="0.07" stroke="#DCD7CC" stroke-width="1" />
    <text x="104" y="828.00" data-field="delta_label" data-maxw="500" data-maxlines="1" data-upper="1"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="17" font-weight="500" letter-spacing="2" fill="#5C6470">{{DELTA_LABEL}}</text>
    <text x="104" y="876.00" font-family="'Source Serif 4', Charter, Georgia, serif"
          font-size="38" font-weight="600" fill="#1D6F63"><tspan x="104" dy="0">{{DELTA_VALUE}}</tspan></text>
    <text x="976" y="876.00" text-anchor="end" data-field="delta_note" data-maxw="600" data-maxlines="1"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="18" fill="#5C6470">{{DELTA_NOTE}}</text>
  </g>

  <line x1="72" y1="938" x2="1008" y2="938" stroke="#DCD7CC" stroke-width="1" />
  <text x="72" y="974.00" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="16" fill="#5C6470"><tspan x="72" dy="0">{{FOOTER}}</tspan></text>
</svg>
