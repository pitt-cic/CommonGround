  <g>
    <line x1="72" y1="{{ROW_Y}}" x2="1008" y2="{{ROW_Y}}" stroke="#DCD7CC" stroke-width="1" />
    <text x="72" y="{{NUM_Y}}" font-family="'Source Serif 4', Charter, Georgia, serif"
          font-size="32" font-weight="600" fill="#1D6F63" fill-opacity="0.75"><tspan x="72" dy="0">{{NUM}}</tspan></text>
    <text x="144" y="{{TITLE_Y}}" data-field="{{ID}}_title" data-maxw="864" data-maxlines="1"
          font-family="'Source Serif 4', Charter, Georgia, serif"
          font-size="26" font-weight="600" fill="#14181D">{{TITLE}}</text>
    <text x="144" y="{{BODY_Y}}" data-field="{{ID}}_body" data-maxw="864" data-maxlines="{{BODY_LINES}}" data-lead="24"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="18" fill="#5C6470">{{BODY}}</text>
  </g>
