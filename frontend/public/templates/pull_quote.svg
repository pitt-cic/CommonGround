  <text x="72" y="226.00" font-family="'Source Serif 4', Charter, Georgia, serif" font-size="28" font-weight="400" fill="#14181D" fill-opacity="0.55"><tspan x="72" dy="0">Insert paper title here, truncated at</tspan><tspan x="72" dy="36">a word boundary if needed</tspan></text>
